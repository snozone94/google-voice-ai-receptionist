services:
  - type: web
    name: google-voice-ai-receptionist
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUSINESS_NAME
        value: DDD
      - key: BUSINESS_PHONE
        value: "+15134091342"
      - key: GOOGLE_VOICE_NUMBER
        value: "+15134091342"
      - key: AI_FORWARDING_NUMBER
        sync: false
      - key: BOOKING_URL
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: CALL_SUMMARY_WEBHOOK_URL
        sync: false
      - key: SMS_FOLLOWUP_WEBHOOK_URL
        sync: false
      - key: VOIPMS_API_USERNAME
        sync: false
      - key: VOIPMS_API_PASSWORD
        sync: false
      - key: VOIPMS_SMS_DID
        sync: false
